tasks:
  setup:
    command: 'setup'
  teardown:
    command: 'teardown'
  a:
    command: 'a'
  b:
    command: 'b'
  c:
    command: 'c'
  # Must run in CI (persistent tasks don't by default) to be waited on
  server:
    command: 'server'
    options:
      persistent: true
      runInCI: true

  # Required dep, and a cleanup dep
  base:
    command: 'base'
    deps:
      - 'setup'
      - target: 'teardown'
        type: 'cleanup'

  # Wait on a persistent dep
  waits:
    command: 'waits'
    deps:
      - target: 'server'
        type: 'wait'

  # All types, ran serially
  serial:
    command: 'serial'
    deps:
      - 'a'
      - target: 'server'
        type: 'wait'
      - 'b'
      - target: 'teardown'
        type: 'cleanup'
    options:
      runDepsInParallel: false

  # A non-persistent wait dep completes, but isn't waited on,
  # so it must not order the serial deps that follow it
  serial-wait:
    command: 'serial-wait'
    deps:
      - 'a'
      - target: 'c'
        type: 'wait'
      - 'b'
    options:
      runDepsInParallel: false

  # The cleanup is passed args, and is also a dependent of
  # the task in the task graph, as it runs after it
  args-parent:
    command: 'args-parent'
    deps:
      - 'setup'
      - target: 'teardown'
        type: 'cleanup'
        args: ['--force']

  # The cleanup also requires the task it cleans up after,
  # which are separate relationships between them
  both-parent:
    command: 'both-parent'
    deps:
      - target: 'both-cleanup'
        type: 'cleanup'

  both-cleanup:
    command: 'both-cleanup'
    deps: ['both-parent']

  # Serial, where the second dependency waits on the first,
  # but must still run after it completes
  serial-inner-wait:
    command: 'serial-inner-wait'
    deps: ['s-first', 's-second']
    options:
      runDepsInParallel: false

  s-first:
    command: 's-first'

  s-second:
    command: 's-second'
    deps:
      - target: 's-first'
        type: 'wait'

  # Shares the cleanup dep with `base`
  other:
    command: 'other'
    deps:
      - target: 'teardown'
        type: 'cleanup'

  # A required chain, the cleanup dep is applied by the test, as it
  # would cycle the task graph if it was configured here
  cycle-parent:
    command: 'cycle-parent'
    deps: ['cycle-mid']
  cycle-mid:
    command: 'cycle-mid'
    deps: ['cycle-cleanup']
  cycle-cleanup:
    command: 'cycle-cleanup'
