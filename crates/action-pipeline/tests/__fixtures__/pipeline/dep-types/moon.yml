tasks:
  # The server signals that it has started, and then waits on the client,
  # while the client waits on the server to start, and then signals it,
  # so both must run at the same time (which deadlocks and times out
  # if the client waits for the server to complete)
  server:
    command: 'node ./signal.mjs serve server-started client-done'

  client:
    command: 'node ./signal.mjs handshake server-started client-done'
    deps:
      - target: 'server'
        type: 'wait'

  # Non-persistent tasks may wait on persistent tasks, but they must
  # also run in CI (they don't by default), when their waiters do
  persistent-server:
    command: 'node ./signal.mjs write persistent-started'
    options:
      persistent: true
      runInCI: true

  persistent-client:
    command: 'node ./signal.mjs wait persistent-started'
    deps:
      - target: 'persistent-server'
        type: 'wait'

  # A wait dependency that has already failed by the time the task
  # runs (after its required dependency, which cleans up after the
  # failed dependency, so always runs after it) skips the task
  crash:
    command: 'node ./signal.mjs fail crashed'
    deps:
      - target: 'settle'
        type: 'cleanup'

  settle:
    command: 'node ./signal.mjs write settled'

  after-crash:
    command: 'node ./signal.mjs write after-crash-ran'
    deps:
      - 'settle'
      - target: 'crash'
        type: 'wait'

  # The cleanup only passes when it runs after its parent
  parent:
    command: 'node ./signal.mjs write parent-ran'
    deps:
      - target: 'cleanup'
        type: 'cleanup'

  cleanup:
    command: 'node ./signal.mjs check parent-ran'

  # The cleanup still runs when its parent fails
  failing-parent:
    command: 'node ./signal.mjs check missing'
    deps:
      - target: 'failing-cleanup'
        type: 'cleanup'

  failing-cleanup:
    command: 'node ./signal.mjs write failing-cleaned'

  # The parent is skipped when its dependency fails (or never runs when
  # bailing), so it never runs its command, and there's nothing to clean up
  broken:
    command: 'node ./signal.mjs check missing'

  blocked-parent:
    command: 'node ./signal.mjs write blocked-ran'
    deps:
      - 'broken'
      - target: 'blocked-cleanup'
        type: 'cleanup'

  blocked-cleanup:
    command: 'node ./signal.mjs write blocked-cleaned'

  # Runs for a while, so is still running (and terminated)
  # when another task aborts the pipeline
  long-sibling:
    command: 'node ./signal.mjs wait never-signaled'

  # The cleanup runs for longer than the process registry's
  # threshold, after which it kills the processes it tracks
  slow-failing-parent:
    command: 'node ./signal.mjs check missing'
    deps:
      - target: 'slow-cleanup'
        type: 'cleanup'

  slow-cleanup:
    command: 'node ./signal.mjs write slow-cleaned 1500'
