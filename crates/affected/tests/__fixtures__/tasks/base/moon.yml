tasks:
  a: {}
  b: {}
  c: {}

  by-env:
    inputs:
      - '$ENV'
  by-file:
    inputs:
      - 'file.txt'
  by-file-match:
    inputs:
      - file: 'file.txt'
        content: 'ba(r|z)'
  by-glob:
    inputs:
      - '*.txt'
  by-affected-only:
    inputs:
      - file: 'file.txt'
        affectedOnly: true
      - glob: '*.md'
        affectedOnly: true
  by-parent-traversal:
    inputs:
      - '.../package.json'
  by-toolchain:
    toolchain: tc-tier1
    inputs:
      - 'file.txt'

  no-inputs:
    inputs: []
