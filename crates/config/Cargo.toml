[package]
name = "moon_config"
version = "2.2.1"
edition = "2024"
license = "MIT"
description = "Core workspace, project, and moon configuration."
homepage = "https://moonrepo.dev/moon"
repository = "https://github.com/moonrepo/moon"
publish = true

[dependencies]
moon_common = { version = "2.1.0", path = "../common" }
moon_target = { version = "3.1.0", path = "../target" }
# Pinned: macro v0.1.4+ rejects lists with more than 1 item for newtype
# variants (`Files(Vec<FilePath>)`), with "expected a tuple of size 1".
deserialize_untagged_verbose_error = "=0.1.5"
deserialize_untagged_verbose_error_macro = "=0.1.3"
indexmap = { workspace = true }
miette = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
schematic = { workspace = true, features = [
	"config",
	"env",
	"extends",
	"json",
	"pkl",
	"schema",
	"toml",
	"type_indexmap",
	"type_regex",
	"validate",
	"validate_url",
	"yaml",
] }
serde = { workspace = true }
serde_json = { workspace = true }
version_spec = { workspace = true, features = ["schematic"] }
warpgate_api = { workspace = true, features = ["schematic"] }

[dev-dependencies]
moon_config_loader = { path = "../config-loader" }
httpmock = { workspace = true }
proto_core = { workspace = true }
serial_test = { workspace = true }
starbase_sandbox = { workspace = true }

[features]
default = []

[lints]
workspace = true
