tasks:
  a:
    command: 'a'
    deps: ['b']
  b:
    command: 'b'
    deps: ['c']
  c:
    command: 'c'
    # Runs after `a`, so the edge is reversed (a -> c), which
    # doesn't cycle with a -> b -> c
    deps:
      - target: 'a'
        type: 'cleanup'
  d:
    command: 'd'
    deps:
      - target: 'a'
        type: 'wait'
