language: javascript
layer: library

tasks:
  build-type:
    type: 'build'
  test-type:
    type: 'test'
  run-type:
    type: 'run'

  build-type-custom:
    type: 'build'
    options:
      runInCI: only
  test-type-custom:
    type: 'test'
    options:
      runInCI: skip
  run-type-custom:
    type: 'run'
    options:
      runInCI: always

  persistent-outputs:
    outputs:
      - 'out'
    options:
      persistent: true
  persistent-build-type:
    type: 'build'
    options:
      persistent: true
  persistent-test-type:
    type: 'test'
    options:
      persistent: true
  persistent-run-type:
    options:
      persistent: true

  persistent-custom:
    outputs:
      - 'out'
    options:
      persistent: true
      runInCI: true
