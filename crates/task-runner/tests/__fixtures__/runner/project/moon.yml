tasks:
  base:
    command: noop

  outputs:
    command: noop
    outputs:
      - 'file.txt'

  dir-outputs:
    command: noop
    outputs:
      - 'dist'

  glob-outputs:
    command: noop
    outputs:
      - '*.txt'

  optional-outputs:
    command: noop
    outputs:
      - file: 'file.txt'
        optional: true

  dep:
    command: noop

  has-deps:
    command: noop
    deps:
      - 'dep'

  has-cleanup-dep:
    command: noop
    deps:
      - target: 'dep'
        type: 'cleanup'

  has-wait-dep:
    command: noop
    deps:
      - target: 'dep'
        type: 'wait'

  no-deps:
    command: noop

  no-cache:
    command: noop
    options:
      cache: false

  cache-lifetime:
    command: noop
    options:
      cacheLifetime: '2s'
